name: smart-kirana-staging

services:
  api:
    image: smart-kirana-staging-api:${STAGING_RELEASE:?Set an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: api
    restart: unless-stopped
    stop_grace_period: 25s
    env_file: ${STAGING_API_ENV:?Set the path to the private staging API env file}
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: https://${STAGING_HOST:?Set the staging HTTPS hostname}
      TRUSTED_PROXY_CIDRS: 172.30.21.2/32
      SMART_KIRANA_UPLOADS_ROOT: /srv/smart-kirana/uploads
    volumes:
      - uploads:/srv/smart-kirana/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 45s
    networks: [backend]

  edge:
    image: smart-kirana-staging-edge:${STAGING_RELEASE:?Set an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: edge
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:?Set the staging HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - edge-data:/data
      - edge-config:/config
    networks:
      backend:
        ipv4_address: 172.30.21.2

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.21.0/24
          ip_range: 172.30.21.128/25

volumes:
  uploads:
    external: true
    name: ${STAGING_UPLOAD_VOLUME:?Set the dedicated persistent staging upload volume}
  edge-data:
  edge-config:
