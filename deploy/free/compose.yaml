name: smart-kirana-free

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: smart-kirana-free-api:${RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: api
    restart: unless-stopped
    stop_grace_period: 25s
    env_file: ${API_ENV_FILE:?Run bash deploy/free/configure.sh first}
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: https://${PUBLIC_HOST:?Set the public DNS hostname}
      TRUSTED_PROXY_CIDRS: 172.30.22.2/32
      SMART_KIRANA_UPLOADS_ROOT: /srv/smart-kirana/uploads
    volumes:
      - uploads:/srv/smart-kirana/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 45s
    networks: [backend]
    logging: *logging

  edge:
    image: smart-kirana-free-edge:${RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: edge
      args:
        CADDYFILE: deploy/free/Caddyfile
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - edge-data:/data
      - edge-config:/config
    networks:
      backend:
        ipv4_address: 172.30.22.2
    logging: *logging

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.22.0/24
          ip_range: 172.30.22.128/25

volumes:
  # External so even `compose down -v` does not delete customer uploads.
  uploads:
    external: true
    name: smart-kirana-free-uploads
  edge-data:
  edge-config:
